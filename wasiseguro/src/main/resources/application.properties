spring.application.name=wasiseguro
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver

# IMPORTANTE: Spring Boot NO convierte automáticamente postgresql:// a jdbc:postgresql://
# Render te da DATABASE_URL como: postgresql://user:pass@host:port/db
# Necesitas convertirla a JDBC format
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Usar variables separadas para user y pass
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}